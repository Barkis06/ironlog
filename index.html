<!doctype html>
<html lang="en">
<head>

  <title>IronLog — Strength Tracker</title>
<style>
  :root { color-scheme: dark; --bg:#0a0d13; --surface:#121821; --surface2:#18212b; --border:#29313d; --text:#f3f6f5; --muted:#98a5b1; --accent:#bbfa79; --accentDark:#1e3420; --blue:#89baff; --amber:#ffd28e; --red:#ff8d96; --shadow:0 14px 36px rgba(0,0,0,.19); }
  * { box-sizing:border-box; }
  html { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text); min-height:100vh; font-size:15px; }
  body::before { content:""; pointer-events:none; position:fixed; inset:0; background:radial-gradient(ellipse at 18% -25%,rgba(187,250,121,.10),transparent 47%); z-index:-1; }
  button, input, textarea, select { font:inherit; }
  button { cursor:pointer; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .wrap { width:min(100%,710px); margin:0 auto; padding: max(18px, env(safe-area-inset-top)) 18px calc(118px + env(safe-area-inset-bottom)); }
  .brand { display:flex; justify-content:space-between; align-items:center; margin:6px 0 23px; }
  .brand-mark { display:flex; align-items:center; gap:10px; font-weight:900; letter-spacing:-.7px; font-size:22px; }
  .mark { display:grid; place-items:center; background:var(--accent); width:36px; height:36px; border-radius:11px; color:#12181b; font-size:19px; font-weight:1000; transform:rotate(-6deg); }
  .tiny-tag { border:1px solid #32412e; background:rgba(187,250,121,.07); color:var(--accent); padding:7px 10px; border-radius:30px; font-weight:750; font-size:11px; letter-spacing:.45px; }
  h1,h2,h3,p { margin-top:0; }
  h1 { font-size:clamp(30px,7.5vw,44px); line-height:1.06; font-weight:850; letter-spacing:-1.5px; margin-bottom:10px; }
  h2 { font-size:21px; letter-spacing:-.55px; margin-bottom:0; }
  h3 { font-size:16px; letter-spacing:-.25px; margin-bottom:0; }
  .eyebrow { color:var(--accent); font-weight:850; text-transform:uppercase; letter-spacing:1.35px; font-size:11px; }
  .muted { color:var(--muted); }
  .small { font-size:12px; line-height:1.5; }
  .section-row { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:28px 0 12px; }
  .hero { position:relative; overflow:hidden; border-radius:25px; padding:25px 23px 23px; background:linear-gradient(130deg,#213827 0%,#172b24 40%,#18272c 100%); border:1px solid #365341; box-shadow:var(--shadow); }
  .hero::after { content:""; position:absolute; width:210px; height:210px; right:-60px; bottom:-130px; border:36px solid rgba(187,250,121,.10); border-radius:50%; }
  .hero h1 { position:relative; max-width:370px; z-index:1; }
  .hero p { color:#c7d8ca; max-width:390px; font-size:13px; line-height:1.6; margin:0; position:relative; z-index:1; }
  .hero-footer { display:flex; align-items:center; justify-content:space-between; gap:14px; margin-top:20px; position:relative; z-index:1; }
  .hero-stat { display:flex; flex-direction:column; gap:4px; }
  .hero-stat strong { font-size:22px; letter-spacing:-.8px; }
  .hero-stat span { color:#b1c3b6; font-size:11px; }
  .ring { position:relative; display:grid; place-items:center; width:73px; height:73px; border-radius:50%; background:conic-gradient(var(--accent) var(--progress),rgba(187,250,121,.18) 0); flex-shrink:0; }
  .ring::before { content:""; position:absolute; inset:7px; border-radius:50%; background:#1c3027; }
  .ring strong { position:relative; font-size:17px; }
  .week-control { display:flex; align-items:center; justify-content:space-between; border:1px solid var(--border); border-radius:15px; padding:9px 11px; background:var(--surface); margin-top:18px; }
  .icon-btn { width:34px; height:34px; border-radius:11px; border:1px solid var(--border); color:var(--text); background:var(--surface2); display:grid; place-items:center; font-size:22px; line-height:1; }
  .week-control .week-label { text-align:center; line-height:1.5; }
  .week-control .week-label strong { display:block; font-size:13px; }
  .week-control .week-label small { display:block; color:var(--muted); font-size:11px; }
  .days { display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:6px; margin:15px 0 4px; }
  .day-btn { padding:11px 0 10px; border-radius:12px; border:1px solid var(--border); background:var(--surface); color:var(--muted); display:flex; flex-direction:column; align-items:center; gap:8px; font-size:10px; font-weight:800; }
  .day-btn b { font-size:14px; color:var(--text); font-weight:750; }
  .day-btn.active { background:var(--accent); border-color:var(--accent); color:#213219; }
  .day-btn.active b { color:#15200e; }
  .day-btn .dot { width:5px; height:5px; border-radius:50%; background:transparent; }
  .day-btn .dot.completed { background:var(--accent); }
  .day-btn.active .dot.completed { background:#15200e; }
  .workout-meta { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin:25px 0 15px; }
  .workout-meta p { margin:5px 0 0; font-size:12px; }
  .pill { display:inline-flex; align-items:center; border:1px solid var(--border); border-radius:50px; background:var(--surface2); padding:7px 10px; white-space:nowrap; color:#c3ced4; font-size:11px; font-weight:700; }
  .pill.green { color:var(--accent); border-color:#3b5138; background:#1a291f; }
  .progress-track { height:6px; background:#28343a; border-radius:12px; overflow:hidden; margin-bottom:18px; }
  .progress-track>div { height:100%; background:var(--accent); transition:width .2s; border-radius:12px; }
  .exercise-card { background:var(--surface); border:1px solid var(--border); border-radius:19px; padding:16px; margin:11px 0; box-shadow:0 5px 20px rgba(0,0,0,.075); }
  .exercise-top { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; margin-bottom:14px; }
  .exercise-index { width:29px; height:29px; flex-shrink:0; background:#26352c; color:var(--accent); font-size:12px; font-weight:850; border-radius:9px; display:grid; place-items:center; }
  .exercise-name { flex:1; min-width:0; }
  .exercise-name h3 { line-height:1.25; }
  .exercise-name p { font-size:11px; color:var(--muted); margin:5px 0 0; }
  .new-tag { color:var(--accent); background:#253c29; border-radius:5px; font-size:9px; font-weight:800; letter-spacing:.5px; padding:3px 5px; vertical-align:middle; margin-left:4px; }
  .rest-button { background:#1d2930; border:1px solid #35424a; border-radius:9px; padding:8px 10px; color:#a8c2c6; font-size:11px; font-weight:700; white-space:nowrap; }
  .set-head,.set-row { display:grid; grid-template-columns:36px minmax(70px,1fr) minmax(70px,1fr) 38px; align-items:center; gap:9px; }
  .set-head { font-size:10px; color:var(--muted); font-weight:750; padding:0 1px 7px; text-align:center; }
  .set-row { margin:7px 0; }
  .set-num { color:#9cabb3; font-size:13px; font-weight:800; text-align:center; }
  .set-input { width:100%; min-width:0; height:40px; padding:7px 8px; border:1px solid #35424a; background:#1b2630; color:var(--text); border-radius:9px; outline:0; text-align:center; font-size:15px; font-weight:700; }
  .set-input::placeholder { color:#667984; font-weight:500; }
  .set-input:focus { border-color:var(--accent); }
  .set-check { width:34px; height:34px; display:grid; place-items:center; border-radius:10px; border:1px solid #40515a; background:#22303a; color:#8998a0; font-weight:900; font-size:17px; }
  .set-check.done { background:var(--accent); border-color:var(--accent); color:#182616; }
  .exercise-bottom { display:flex; justify-content:space-between; align-items:center; gap:8px; padding-top:10px; margin-top:9px; border-top:1px solid #26323b; }
  .exercise-bottom span { font-size:11px; color:var(--muted); line-height:1.4; }
  .exercise-bottom strong { color:var(--blue); font-size:11px; text-align:right; white-space:nowrap; }
  .empty { background:var(--surface); border:1px dashed #3d4a52; border-radius:20px; padding:30px 22px; text-align:center; }
  .empty-emoji { font-size:34px; margin-bottom:11px; }
  .empty h3 { font-size:19px; margin:5px 0 8px; }
  .empty p { color:var(--muted); margin:0 auto 17px; font-size:13px; line-height:1.7; max-width:350px; }
  .primary-btn { border:0; background:var(--accent); color:#162013; font-weight:850; border-radius:12px; padding:12px 17px; }
  .secondary-btn { background:var(--surface2); color:var(--text); border:1px solid var(--border); font-weight:750; border-radius:12px; padding:11px 14px; }
  .tiny-btn { border:0; background:transparent; color:var(--accent); padding:5px; font-size:12px; font-weight:800; }
  .note { background:#1b242d; border-left:3px solid var(--accent); border-radius:0 11px 11px 0; padding:12px 13px; font-size:12px; color:#b7c4cb; line-height:1.6; margin:17px 0; }
  .note b { color:var(--text); }
  .textarea { width:100%; min-height:72px; resize:vertical; background:var(--surface); color:var(--text); border:1px solid var(--border); border-radius:13px; padding:13px; font-size:13px; }
  .day-plan { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px; margin-bottom:10px; }
  .day-plan-top { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .day-plan .focus { font-size:12px; color:var(--muted); margin:5px 0 12px; }
  .plan-line { display:flex; justify-content:space-between; padding:8px 0; border-top:1px solid #26303a; font-size:12px; gap:12px; }
  .plan-line span:last-child { color:var(--muted); white-space:nowrap; }
  .stats { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:9px; margin:18px 0 8px; }
  .stat { background:var(--surface); border:1px solid var(--border); border-radius:15px; padding:15px 10px; }
  .stat strong { display:block; font-size:25px; letter-spacing:-.8px; white-space:nowrap; }
  .stat span { font-size:10px; color:var(--muted); display:block; margin-top:5px; }
  .chart-card,.settings-card { background:var(--surface); border:1px solid var(--border); border-radius:18px; padding:17px; margin:14px 0; }
  select { background:#1c2832; color:var(--text); border:1px solid #374650; border-radius:10px; padding:9px 12px; max-width:100%; }
  .chart { width:100%; height:210px; display:block; }
  .history-item { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:13px 0; border-bottom:1px solid var(--border); }
  .history-item:last-child { border-bottom:0; }
  .history-item b { font-size:13px; }
  .history-item small { display:block; margin-top:5px; color:var(--muted); font-size:11px; }
  .history-count { color:var(--accent); font-size:12px; font-weight:800; white-space:nowrap; }
  .settings-card h3 { margin-bottom:10px; }
  .settings-card p { color:var(--muted); font-size:13px; line-height:1.65; }
  .button-row { display:flex; flex-wrap:wrap; gap:8px; }
  .steps { padding-left:21px; color:#bfcbd1; font-size:13px; line-height:1.8; }
  .steps li { margin:8px 0; }
  .danger { color:var(--red); border-color:#64444b; }
  .bottom-nav { position:fixed; z-index:40; bottom:0; left:0; right:0; background:rgba(15,20,28,.95); border-top:1px solid #34404a; backdrop-filter:blur(18px); padding:10px max(15px, env(safe-area-inset-left)) calc(10px + env(safe-area-inset-bottom)) max(15px, env(safe-area-inset-right)); }
  .nav-inner { width:min(100%,710px); margin:auto; display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:5px; }
  .nav-btn { background:none; border:0; color:#9aabb6; display:flex; align-items:center; flex-direction:column; gap:4px; font-size:10px; font-weight:750; border-radius:12px; padding:7px 3px 6px; }
  .nav-btn svg { width:23px; height:23px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
  .nav-btn.active { color:var(--accent); background:rgba(187,250,121,.06); }
  .timer-dock { display:none; position:fixed; z-index:30; bottom:calc(82px + env(safe-area-inset-bottom)); width:min(calc(100% - 36px),674px); left:50%; transform:translateX(-50%); background:#c0fc81; color:#152011; padding:12px 15px; border-radius:16px; box-shadow:0 10px 25px rgba(0,0,0,.4); align-items:center; justify-content:space-between; gap:15px; }
  .timer-dock.visible { display:flex; }
  .timer-dock strong { font-size:21px; font-variant-numeric:tabular-nums; }
  .timer-dock span { font-size:11px; font-weight:700; opacity:.85; display:block; }
  .timer-dock button { background:#182418; color:#e6ffd2; border:0; border-radius:10px; padding:10px 15px; font-size:12px; font-weight:800; }
  .top-muted { color:var(--muted); font-size:12px; margin:5px 0 17px; line-height:1.7; }
  .toast { position:fixed; z-index:80; left:50%; transform:translateX(-50%); bottom:calc(165px + env(safe-area-inset-bottom)); width:max-content; max-width:calc(100vw - 40px); background:#e8ffe0; color:#182614; padding:11px 16px; border-radius:12px; font-weight:750; font-size:12px; text-align:center; box-shadow:var(--shadow); display:none; }
  .footer { text-align:center; color:#71808c; margin:25px 0; font-size:11px; }

  /* Inline technique help and video discovery */
  .form-tools {display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; align-items:center;}
  .form-toggle,.video-link {display:inline-flex; align-items:center; justify-content:center; gap:6px; font-weight:800; font-size:12px; min-height:38px; padding:8px 12px; border-radius:10px; text-decoration:none;}
  .form-toggle {background:#26352b; border:1px solid #3e6247; color:var(--accent);}
  .video-link {background:#253141; border:1px solid #425671; color:#cce1ff;}
  .form-toggle:hover,.form-toggle[aria-expanded="true"] {background:#304b34;}
  .video-link:hover {background:#31445d;}
  .technique-guide {margin-top:11px; padding:13px; border-radius:12px; background:#19252d; border:1px solid #334650; font-size:12px; line-height:1.6;}
  .technique-guide[hidden] {display:none;}
  .technique-guide .targets {font-size:10px; font-weight:850; text-transform:uppercase; letter-spacing:.6px; color:var(--accent); margin-bottom:6px;}
  .technique-guide ol {padding-left:20px; margin:5px 0 9px; color:#d6e0e4;}
  .technique-guide li {padding:2px 0;}
  .technique-guide .watch-out {border-top:1px solid #32434b; padding-top:9px; margin:0; color:#c6d1d7;}
  .technique-guide .watch-out strong {color:#ffd28e;}
  .video-notice {font-size:11px; line-height:1.5; color:var(--muted); margin:10px 0 0;}
  .plan-exercises {margin-top:10px;}
  .plan-entry {border-top:1px solid #26303a; padding:10px 0;}
  .plan-entry-head {display:flex; align-items:center; justify-content:space-between; gap:9px;}
  .plan-entry-name {font-size:12px; font-weight:700; min-width:0;}
  .plan-entry-reps {font-size:11px; color:var(--muted); white-space:nowrap;}
  .plan-entry-actions {display:flex; gap:8px; margin-top:7px;}
  .plan-entry-actions .form-toggle,.plan-entry-actions .video-link {min-height:30px; padding:5px 9px; font-size:11px;}
  @media (max-width:355px) { .form-toggle,.video-link {font-size:11px; padding:8px;} .plan-entry-head {flex-wrap:wrap;} }

  /* AI Coach: prompt handoff to ChatGPT and offline quick-reference guides */
  .coach-hero {background:linear-gradient(135deg,#273c2b,#172b29 65%,#1b2731);border:1px solid #3c624a;border-radius:24px;padding:24px;position:relative;overflow:hidden;}
  .coach-hero:after {content:"✦";position:absolute;right:19px;top:16px;color:rgba(187,250,121,.14);font-size:78px;pointer-events:none;}
  .coach-hero h1 {font-size:clamp(29px,7vw,40px);max-width:370px;margin:12px 0;}
  .coach-hero p {font-size:13px;line-height:1.65;color:#c3d2ca;margin:0;max-width:420px;}
  .coach-card {background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:17px;margin-top:16px;}
  .coach-card label {display:block;font-size:12px;color:var(--text);font-weight:850;margin-bottom:10px;}
  .coach-question {width:100%;min-height:116px;resize:vertical;background:#1b2630;color:var(--text);border:1px solid #435660;border-radius:13px;padding:13px;font-size:15px;line-height:1.55;}
  .coach-question:focus {border-color:var(--accent);}
  .coach-actions {display:flex;gap:9px;flex-wrap:wrap;margin-top:12px;}
  .coach-actions .primary-btn {flex:1;min-width:165px;}
  .coach-smallprint {color:var(--muted);font-size:12px;line-height:1.6;margin:11px 0 0;}
  .coach-chips {display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .coach-chip {text-align:left;border:1px solid #3b4c4a;border-radius:12px;background:#1b2a2c;color:#d9e8df;padding:12px 11px;min-height:55px;font-size:12px;font-weight:750;line-height:1.4;}
  .coach-chip:active {background:#30483a;}
  .coach-faq {border:1px solid var(--border);border-radius:13px;background:var(--surface);margin:9px 0;overflow:hidden;}
  .coach-faq summary {padding:15px 14px;font-size:13px;font-weight:800;cursor:pointer;line-height:1.5;}
  .coach-faq[open] summary {color:var(--accent);border-bottom:1px solid var(--border);}
  .coach-faq p {font-size:13px;line-height:1.7;color:#c7d2d7;padding:12px 14px 16px;margin:0;}
  .coach-exercise {background:#24372e;border:1px solid #375544;border-radius:10px;color:#c9f7c0;font-weight:800;padding:8px 10px;font-size:12px;min-height:38px;}
  @media(max-width:390px) {.coach-chips {grid-template-columns:1fr;} .nav-btn {font-size:9px;}}

  @media(min-width:650px) { .wrap { padding-left:26px; padding-right:26px; } .hero { padding:31px; } .exercise-card { padding:21px; } .set-head,.set-row { grid-template-columns:54px 1fr 1fr 54px; } }
  @media(prefers-reduced-motion:reduce) { *,*::before,*::after { transition:none!important; scroll-behavior:auto!important; } }
</style>
</head>
<body>
  <div class="wrap">
    <header class="brand"><div class="brand-mark"><div class="mark">I</div><span>IRONLOG<span style="color:var(--accent)">.</span></span></div><span class="tiny-tag">STRENGTH / 5 DAYS · v2.2</span></header>

  <nav class="bottom-nav" aria-label="Main navigation"><div class="nav-inner" id="nav"></div></nav>
  <input id="importFile" type="file" accept=".json,application/json" hidden />
<script>

 const dots=p.map((v,i)=>`<circle cx="${v.x}" cy="${v.y}" r="4" fill="#bbfa79" stroke="#213524" stroke-width="2"/><text x="${v.x}" y="${v.y-10}" text-anchor="middle" font-size="9" font-weight="800" fill="#dcebd8">${fmt(arr[i].val)}</text>`).join('');
 const labels=p.map((v,i)=>(i===0||i===p.length-1||p.length<=4)?`<text x="${v.x}" y="${height-9}" text-anchor="middle" font-size="9" fill="#97aab3">${esc(dateShort(new Date(arr[i].date+'T12:00:00')))}</text>`:'').join('');
 return `<svg class="chart" viewBox="0 0 ${width} ${height}" aria-label="Logged maximum working weights over time, kilograms" role="img">${grid}${line}${dots}${labels}</svg><p class="small muted" style="margin-bottom:0">Heaviest completed working set (kg) per logged session. Up to 10 entries.</p>`;
}
function progressView(){const history=sessionEntries(),sets=history.reduce((a,b)=>a+b.count,0),vol=history.reduce((a,b)=>a+b.vol,0); const lifts=[['squat','Back Squat'],['bench','Bench Press'],['ohp','Overhead Press'],['hack','Hack Squat'],['hip1','Hip Thrust Machine'],['shrugs','Dumbbell Shrugs'],['wrist','Reverse Wrist Curls']];
 let html=`<span class="eyebrow">Your hard work, measured</span><h1 style="margin-top:10px">Keep getting stronger.</h1><p class="top-muted">Your data is stored locally in this browser. Every checked-off set counts toward your history.</p><div class="stats"><div class="stat"><strong>${history.length}</strong><span>Sessions logged</span></div><div class="stat"><strong>${sets}</strong><span>Sets finished</span></div><div class="stat"><strong>${vol>=1000?(vol/1000).toFixed(1)+'k':Math.round(vol)}</strong><span>Approx. kg × reps</span></div></div>`;
 html+=`<div class="section-row"><h2>Weight progress</h2></div><div class="chart-card"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px"><b style="font-size:13px">Top working weight</b><select id="chartLift" aria-label="Choose exercise for progress chart">${lifts.map(([id,name])=>`<option value="${id}" ${chartLift===id?'selected':''}>${esc(name)}</option>`).join('')}</select></div>${chartMarkup(chartLift)}</div>`;
 html+=`<div class="section-row"><h2>Recent workouts</h2><span class="pill">${history.length} total</span></div>`;
 if(!history.length)html+=`<div class="empty"><h3>No workouts logged yet</h3><p>After your first set, your exercise history will appear here.</p><button class="primary-btn" data-action="nav" data-value="today">Start logging</button></div>`;
 else html+=`<div class="settings-card">${history.slice(0,12).map(item=>{const day=(new Date(item.date+'T12:00:00').getDay()+6)%7;return `<div class="history-item"><div><b>${esc(dayNames[day])} · ${esc(R[day].name)}</b><small>${esc(dateLong(new Date(item.date+'T12:00:00')))}</small></div><span class="history-count">${item.count} sets ✓</span></div>`;}).join('')}</div>`;
 html+=`<div class="note"><b>Progress tip:</b> After you hit every set at the top of its rep range with good form, add a small amount of weight the next time. For assisted pull-ups, less assistance makes the movement harder.</div>`;
 return html;
}
function coachView(){
 const suggestions=[
  ['Choosing weights','How do I choose my starting weights for each exercise?'],
  ['Squat technique','How should I squat safely at 194 cm tall?'],
  ['Exercise swaps','What can I replace an exercise with if a machine is busy?'],
  ['Getting stronger','How can I tell when to add more weight?'],
  ['Eating more','What should I eat to get stronger and gain muscle?'],
  ['Missing a session','What should I do if I miss a gym day?']
 ];
 const faq=[
  ['When should I increase my weights?','Only increase when you finish every set and rep with controlled technique and about 1–2 good reps to spare. Try small jumps: 1–2.5 kg for upper-body barbell lifts and 2.5–5 kg for lower-body lifts when appropriate.'],
  ['Why does my program have no deadlifts?','You said deadlift technique feels difficult. Squats, hip thrusts, leg curls and rows let you train your legs and back while focusing on easier-to-learn setups. You can learn deadlifts later if you want to.'],
  ['Am I training traps and forearms?','Yes. Friday includes dumbbell shrugs (upper traps), and Wednesday includes reverse wrist curls (forearm extensors). Rows, pull-ups and face pulls also help your upper back and grip.'],
  ['What if an exercise hurts?','Stop the painful movement. Do not force reps through sharp pain. If pain persists or affects daily activities, ask a qualified healthcare professional or physiotherapist to assess it.'],
  ['How much protein should I eat?','Your starting target is around 115–145 g of protein daily. To gain strength and body mass, aim for a modest calorie surplus and monitor your weight trend over a few weeks.'],
  ['Do I need to train to failure?','No. As a beginner, leave roughly 2–3 repetitions in reserve when learning movements. Good form and consistent progressive training matter more than exhausting yourself.']
 ];
 return `<span class="eyebrow">Personal training help</span>
   <div class="coach-hero" style="margin-top:12px"><span class="eyebrow">✦ IRONLOG COACH</span><h1>Got a gym question?</h1><p>Ask ChatGPT with your exact five-day strength program already included as context. No need to explain your routine every time.</p></div>
   <div class="coach-card"><label for="coachQuestion">What would you like to ask?</label>
     <textarea id="coachQuestion" class="coach-question" maxlength="700" placeholder="For example: What if I can't do Bulgarian split squats?">${esc(coachDraft)}</textarea>
     <div class="coach-actions"><button type="button" class="primary-btn" data-action="coach-ask">✦ Ask ChatGPT ↗</button><button type="button" class="secondary-btn" data-action="coach-copy">Copy with program</button></div>
     <p class="coach-smallprint">This opens ChatGPT separately; answers won't appear inside IronLog yet. Your question and training plan are pre-filled, but you may need to tap Send. If the prompt doesn't appear, use the Copy button and paste it in ChatGPT. No workout history is sent.</p></div>
   <div class="section-row"><h2>Try asking</h2><span class="pill green">Program-aware</span></div>
   <div class="coach-chips">${suggestions.map(([label,q])=>`<button class="coach-chip" type="button" data-action="coach-suggestion" data-question="${esc(q)}">✦ ${esc(label)}</button>`).join('')}</div>
   <div class="section-row"><h2>Quick answers</h2><span class="pill">Works offline</span></div>
   ${faq.map(([q,a])=>`<details class="coach-faq"><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join('')}
   <div class="note"><b>Remember:</b> These quick answers are pre-written reference tips, not live AI. ChatGPT may make mistakes and doesn't replace professional assessment for injuries or persistent pain.</div>`;
}
function coachPrompt(question){
 return [
 'You are helping me with my existing personal gym strength plan. Please answer in plain, concise, beginner-friendly language. My goal is strength, not just bodybuilding.',
 'Profile: 19 years old, 194 cm, 71 kg, beginner, full gym access, 5 gym days weekly. I have difficulty with deadlift technique, so my plan intentionally excludes deadlifts and Romanian deadlifts.',
 'My actual weekly exercise plan:',
 ...R.map((day,i)=>day.exercises.length?dayNames[i]+': '+day.exercises.map(ex=>ex.name+' '+ex.sets+'x'+target(ex)).join('; '):dayNames[i]+': Rest'),
 'Suggest replacements that match this plan and explain changes in sets/reps when needed. Prioritize good technique, gradual progression, recovery and safety. Do not assume I can already lift a particular weight.',
 'My question: '+question
 ].join('\n');
}
function moreView(){return `<span class="eyebrow">Your training setup</span><h1 style="margin-top:10px">Your guide.</h1><p class="top-muted">Everything you need to run your program and keep your progress safe.</p>
 <div class="settings-card"><h3>Your starting profile</h3><div class="stats" style="margin-bottom:0"><div class="stat"><strong>19</strong><span>Years old</span></div><div class="stat"><strong>194</strong><span>Height · cm</span></div><div class="stat"><strong>71</strong><span>Starting kg</span></div></div><p style="margin:14px 0 0">Goal: <b style="color:var(--text)">strength</b>. Plan: <b style="color:var(--text)">5 days per week</b>, with Wednesday intentionally lighter.</p></div>
 <div class="settings-card"><h3>Nutrition & recovery</h3><div class="plan-line"><span>Protein</span><span>115–145 g/day</span></div><div class="plan-line"><span>Calorie surplus</span><span>+250–350/day*</span></div><div class="plan-line"><span>Gradual gain</span><span>0.2–0.4 kg/week</span></div><div class="plan-line"><span>Sleep</span><span>8–9 hours</span></div><p style="margin:10px 0 0">*Estimate above your maintenance calories. Adjust according to your actual weight trend.</p></div>
 <div class="settings-card"><h3>Progression rules</h3><p>In the first 2 weeks, practice form with 2–3 reps left in reserve. When you comfortably finish all sets and reps, increase upper-body barbell lifts by approximately 1–2.5 kg and lower-body lifts by 2.5–5 kg. Machine increments vary. Stop or modify painful movements and ask a qualified trainer for form help.</p></div>
 <div class="settings-card"><h3>Exercise technique & videos</h3><p>Each exercise has a quick 3-step guide and common technique mistake under <b style="color:var(--text)">Form tips</b>. The <b style="color:var(--text)">Video demos</b> link opens YouTube search results for that exercise. The tips work offline; videos need internet. Demonstrations are not independently vetted. Learn new barbell lifts with a qualified trainer when possible.</p></div>
 <div class="settings-card"><h3>Keep a backup of your logs</h3><p>Your logs are saved on this device in this browser, not synced to an account. Export periodically so you don't lose progress if you clear browser data or change phones.</p><div class="button-row"><button class="primary-btn" data-action="export">↓ Export backup</button><button class="secondary-btn" data-action="import">↑ Import backup</button></div></div>
 <div class="settings-card"><h3>Add IronLog to your home screen</h3><p>This app can work offline after it is opened once from its HTTPS web address.</p><ol class="steps"><li><b>iPhone:</b> Open the hosted app link in Safari, tap <b>Share</b>, then <b>Add to Home Screen</b> → <b>Add</b>.</li><li><b>Android:</b> Open the hosted app in Chrome, tap the menu (⋮), then <b>Install app</b> or <b>Add to Home screen</b>.</li></ol><p>For full home-screen installation, upload the included app folder to a static HTTPS host first. A locally opened HTML file may not support installation or reliable saving on iPhone.</p></div>
 <div class="settings-card"><h3>Reset progress</h3><p>This permanently clears workout logs and notes on this device. Export a backup first if you want to keep them.</p><button class="secondary-btn danger" data-action="reset">Clear all workout history</button></div>`;}
function render(){if(view==='today')main.innerHTML=todayView();else if(view==='plan')main.innerHTML=planView();else if(view==='progress')main.innerHTML=progressView();else if(view==='coach')main.innerHTML=coachView();else main.innerHTML=moreView();renderNav();}
function scrollTop(){window.scrollTo({top:0,behavior:'instant'});}
function beginRest(ex){if(!ex||!ex.rest)return;timerName=ex.name;timerUntil=Date.now()+ex.rest*1000;updateTimer();flash('Rest started: '+restText(ex.rest));}
function updateTimer(){const remaining=Math.max(0,Math.ceil((timerUntil-Date.now())/1000));if(!remaining){if(timerUntil){timerUntil=0;timerDock.classList.remove('visible');try{navigator.vibrate?.(80)}catch{}}return;}timerDock.classList.add('visible');timerText.textContent=Math.floor(remaining/60)+':'+pad(remaining%60);timerDock.querySelector('span').textContent='REST · '+timerName;}
setInterval(updateTimer,1000);
document.getElementById('stopTimer').addEventListener('click',()=>{timerUntil=0;timerDock.classList.remove('visible');});
document.body.addEventListener('click',event=>{
 const btn=event.target.closest('[data-action]');if(!btn)return;
 const a=btn.dataset.action,v=btn.dataset.value;
 
  if(a==='coach-suggestion'){coachDraft=btn.dataset.question||'';render();scrollTop();document.getElementById('coachQuestion')?.focus();return;}
  if(a==='coach-exercise'){coachDraft='How do I perform '+(btn.dataset.name||'this exercise')+' with correct technique, and what mistakes should I avoid?';view='coach';render();scrollTop();return;}
  if(a==='coach-ask'){
   const q=String(document.getElementById('coachQuestion')?.value||'').trim();
   if(!q){flash('Write a question first.');document.getElementById('coachQuestion')?.focus();return;}
   coachDraft=q;
   window.open('https://chatgpt.com/?q='+encodeURIComponent(coachPrompt(q)),'_blank','noopener,noreferrer');
   flash('Opening ChatGPT. Tap Send there to ask.');
   return;
  }
  if(a==='coach-copy'){
   const q=String(document.getElementById('coachQuestion')?.value||'').trim();
   if(!q){flash('Write a question first.');return;}
   coachDraft=q;
   if(!navigator.clipboard?.writeText){flash('Copy unavailable here. Select your question and copy it.');return;}
   navigator.clipboard.writeText(coachPrompt(q)).then(()=>flash('Question + workout copied!')).catch(()=>flash('Copy failed. Try opening ChatGPT instead.'));
   return;
  }
  if(a==='nav'){view=v;render();scrollTop();return;}
 if(a==='day'){selectedDay=Number(v);view='today';render();return;}
 if(a==='week'){weekOffset+=Number(v);render();return;}
 if(a==='open-day'){selectedDay=Number(v);weekOffset=0;view='today';render();scrollTop();return;}
 if(a==='guide'){const target=document.getElementById(btn.dataset.target);if(!target)return;const expand=target.hidden;target.hidden=!expand;btn.setAttribute('aria-expanded',String(expand));btn.innerHTML=expand?'ℹ Hide tips <span aria-hidden="true">⌃</span>':'ℹ Form tips <span aria-hidden="true">⌄</span>';return;}
 if(a==='rest'){const ex=R[Number(btn.dataset.day)].exercises.find(e=>e.id===btn.dataset.id);beginRest(ex);return;}
 if(a==='complete'){
  const day=Number(btn.dataset.day),ex=R[day].exercises.find(e=>e.id===btn.dataset.id);if(!ex)return;
  const date=btn.dataset.date,i=Number(btn.dataset.set),s=getSet(date,ex.id,i);const next=!s.done;
  const patch={done:next};if(next&&(s.reps==null||s.reps===''))patch.reps=ex.min;
  updateSet(date,ex.id,i,patch);if(next&&ex.rest)beginRest(ex);
  render();return;
 }
 if(a==='export'){
  const payload={app:'IronLog',version:1,exportedAt:new Date().toISOString(),data};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='ironlog-backup-'+iso(new Date())+'.json';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);flash('Backup file created');return;
 }
 if(a==='import'){document.getElementById('importFile').click();return;}
 if(a==='reset'){if(confirm('Delete all local workout logs and notes? This cannot be undone.')){data={sessions:{},notes:{}};save();render();flash('Workout history cleared.');}return;}
});
document.body.addEventListener('input',event=>{
 const t=event.target;if(t.id==='coachQuestion'){coachDraft=t.value;return;}if(!t.dataset.field)return;
 if(t.dataset.field==='notes'){data.notes[t.dataset.date]=t.value;save();return;}
 const id=t.dataset.id,date=t.dataset.date,i=Number(t.dataset.set);if(!date||!id)return;
 const value=t.value===''?null:Number(t.value);
 if(value!=null&&(!Number.isFinite(value)||value<0))return;
 updateSet(date,id,i,{[t.dataset.field]:value});
});
document.body.addEventListener('change',event=>{if(event.target.id==='chartLift'){chartLift=event.target.value;render();}});
document.getElementById('importFile').addEventListener('change',async event=>{
 const f=event.target.files?.[0];if(!f)return;
 if(f.size>2000000){flash('Backup is too large.');event.target.value='';return;}
 try {const raw=JSON.parse(await f.text());const imported=raw?.data;if(raw?.app!=='IronLog'||!imported||typeof imported.sessions!=='object'||!imported.sessions||Array.isArray(imported.sessions))throw Error('Not an IronLog backup');if(!confirm('Replace current workout logs with the backup? Export current logs first if needed.'))return;data={sessions:imported.sessions,notes:imported.notes&&typeof imported.notes==='object'&&!Array.isArray(imported.notes)?imported.notes:{}};save();render();flash('Backup imported successfully');}catch(err){alert('Unable to import: '+err.message);}finally{event.target.value='';}
});
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();
})();
</script>
